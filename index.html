<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер тренувань</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1>Трекер тренувань</h1>
    </header>

    <main>
        <section id="add">
            <h2>Додати тренування</h2>
            <form>
                <label for="workout-input">Введіть тренування</label>
                <input type="text" id="workout-input" name="workout">
            </form>
        </section>

        <section id="workout-history">
            <h2>Історія тренувань</h2>
            <article>
                <h3>04.09.2026 Кросфіт</h3>
            </article>
        </section>
    </main>

    <aside>
        <p>Кількість тренувань: ...</p>
        <p>Загальний час тренувань: ...</p>
    </aside>

    <footer>
        <p>© 2026 Мусієнко Ігор.</p>
    </footer>

    <script src="./js/app.js"></script>
</body>
</html>
