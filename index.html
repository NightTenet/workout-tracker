<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер тренувань</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@600;700&display=swap"
        rel="stylesheet">
    <script src="./js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>Трекер тренувань</h1>
    </header>

    <div class="grid-container">
        <main>
            <section id="add">
                <h2>Додати тренування</h2>
                <form id="add-form">
                    <label for="type-input">Введіть тип тренування:</label>
                    <select name="type" id="type-input" required>
                        <option value="">-Оберіть тип-</option>
                        <option value="фулбоді">фулбоді</option>
                        <option value="кардіо">кардіо</option>
                        <option value="кросфіт">кросфіт</option>
                    </select>

                    <label for="minutes-input">Введіть час тренування (у хв):</label>
                    <input type="number" id="minutes-input" name="minutes" min="1" required>

                    <label for="calories-input">Введіть к-ть спалених калорій (ккал):</label>
                    <input type="number" id="calories-input" name="calories" min="1" required>

                    <button type="submit">Додати</button>
                </form>
            </section>
    
            <section id="workout-history">
                <h2>Історія тренувань</h2>
                <div class="cards" id="workouts-list">
                    <article class="card crossfit">
                        <h3>
                            <img src="./assets/img/free-icon-dumbbell-3043888.png" alt="A workout icon">
                            04.09.2026 Кросфіт
                        </h3>
                    </article>
                    <article class="card cardio">
                        <h3>
                            <img src="./assets/img/free-icon-dumbbell-3043888.png" alt="A workout icon">
                            09.09.2026 Кардіо
                        </h3>
                    </article>
                    <article class="card fullbody">
                        <h3>
                            <img src="./assets/img/free-icon-dumbbell-3043888.png" alt="A workout icon">
                            11.09.2026 Фулбоді
                        </h3>
                    </article>
                </div>
            </section>
            <p id="total-calories"></p>
            <p id="calories-per-minute"></p>
        </main>
    
        <aside>
            <h2>Мої досягнення</h2>

            <div class="progress-block">
                <label for="week-progress">Виконано 3 з 5 запланованих тренувань</label>
                <progress id="week-progress" value="3" max="5">3 з 5</progress>
            </div>

            <div class="stat">
                <p>Кількість тренувань:</p>
                <strong>3</strong>
            </div>
            <div class="stat">
                <p>Загальний час тренувань:</p>
                <strong>2 год. 45 хв.</strong>
            </div>
            <div class="stat record">
                <p class="record-label">Рекорд за тиждень</p>
                <strong class="record-value">4 тренування</strong>
            </div>
        </aside>
    </div>

    <footer>
        <p>© 2026 Мусієнко Ігор.</p>
    </footer>
</body>
</html>
