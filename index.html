<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер тренувань</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1>Трекер тренувань</h1>
    </header>

    <div class="grid-container">
        <main>
            <section id="add">
                <h2>Додати тренування</h2>
                <form>
                    <label for="workout-input">Введіть тренування</label>
                    <input type="text" id="workout-input" name="workout">
                </form>
            </section>
    
            <section id="workout-history">
                <h2>Історія тренувань</h2>
                <div class="cards">
                    <article class="card">
                        <h3>
                            <img src="./assets/img/free-icon-dumbbell-3043888.png" alt="A wokrout icon">
                            04.09.2026 Кросфіт
                        </h3>
                    </article>
                    <article class="card">
                        <h3>
                            <img src="./assets/img/free-icon-dumbbell-3043888.png" alt="A wokrout icon">
                            09.09.2026 Кардіо
                        </h3>
                    </article>
                    <article class="card">
                        <h3>
                            <img src="./assets/img/free-icon-dumbbell-3043888.png" alt="A wokrout icon">
                            11.09.2026 Фулбоді
                        </h3>
                    </article>
                </div>
            </section>
        </main>
    
        <aside>
            <p>Кількість тренувань: ...</p>
            <p>Загальний час тренувань: ...</p>
        </aside>
    </div>

    <footer>
        <p>© 2026 Мусієнко Ігор.</p>
    </footer>

    <script src="./js/app.js"></script>
</body>
</html>
